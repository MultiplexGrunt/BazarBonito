name: Compilar APK Android (Bazar Bonito)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x android_app/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android_app
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BazarBonito-app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
